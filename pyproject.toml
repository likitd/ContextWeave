[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid RAG application using AgentFS + BM25 + Semantic Search with LangChain"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.0.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",
    "unstructured>=0.15.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "networkx>=3.0",
    "scikit-learn>=1.4.0",
    "lightrag-hku>=1.0.0",
    "numpy>=1.24.0",
    "pyvis>=0.3.2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
hybrid-rag = "main:run"
